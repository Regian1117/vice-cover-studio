<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vice Cover Studio — Multi-Panel GTA 6 Cover Art Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="studio-shell" class="studio-shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M11.5 2L9.5 22M10.7 11.5L22 10" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="3" width="7.2" height="18" fill="#FF6242" fill-opacity="0.32"/>
        </svg>
        <span class="brand-name">Vice Cover Studio</span>
      </div>

      <div class="topbar-group">
        <div id="preset-bar" class="preset-bar" role="group" aria-label="Quick presets"></div>
        <div class="history-group" role="group" aria-label="History and randomize">
          <button id="btn-undo" class="btn-tool" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14L4 9l5-5"/>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
            </svg>
          </button>
          <button id="btn-redo" class="btn-tool" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 14l5-5-5-5"/>
              <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>
            </svg>
          </button>
          <button id="btn-surprise" class="btn-surprise" type="button" title="Randomize layout, Vice grade, title & photo arrangement">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"/>
              <line x1="4" y1="20" x2="21" y2="3"/>
              <polyline points="21 16 21 21 16 21"/>
              <line x1="15" y1="15" x2="21" y2="21"/>
              <line x1="4" y1="4" x2="9" y2="9"/>
            </svg>
            <span>Surprise Me</span>
          </button>
        </div>
      </div>

      <div class="topbar-actions">
        <div id="size-switcher" class="segmented" role="group" aria-label="Canvas aspect ratio"></div>
        <button id="export-primary" class="btn-primary" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="export-primary-label">Export 1920 × 1080</span>
        </button>
        <button id="export-all-3" class="btn-secondary-cta" type="button" title="Export 1920×1080, 1080×1350, and 1080×1080 PNGs in one click">
          <span>Export All 3</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <!-- Left Rail: Photos, Multi-Panel Layouts, Color Grade & Art Pipeline -->
      <aside class="rail rail-left" aria-label="Photos, layout and style">
        <section class="panel-section">
          <div class="section-head">
            <h2>Photos</h2>
            <span id="photo-count" class="meta-pill">5 ready</span>
          </div>
          <div class="upload-row">
            <label class="btn-upload" for="upload-single" title="Upload one photo and auto-fill every panel with smart varied crops">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>1 Photo → All</span>
              <input id="upload-single" type="file" accept="image/*" hidden>
            </label>
            <label class="btn-upload" for="upload-multi" title="Upload multiple photos to populate all panels">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span>Multi Upload</span>
              <input id="upload-multi" type="file" accept="image/*" multiple hidden>
            </label>
          </div>
          <div id="photo-tray" class="photo-tray" aria-label="Loaded photos"></div>
          <div class="tray-actions">
            <button id="btn-autofill-one" class="btn-ghost btn-xs" type="button" title="Fill all panels with the active photo using varied dramatic crops">Auto-fill 1 photo</button>
            <button id="btn-distribute-all" class="btn-ghost btn-xs" type="button" title="Distribute all loaded photos across panels">Distribute photos</button>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-head">
            <h2>Panel Layout</h2>
          </div>
          <div id="layout-grid" class="layout-grid" role="radiogroup" aria-label="Panel layout"></div>
        </section>

        <section class="panel-section">
          <div class="section-head">
            <h2>Vice Color Grade</h2>
          </div>
          <div id="grade-grid" class="grade-grid" role="radiogroup" aria-label="Color grade"></div>

          <div class="slider-stack">
            <label class="slider-row">
              <span class="slider-label">
                <span>Painterly Art</span>
                <output id="paint-val" class="num-val">72%</output>
              </span>
              <input id="paint-slider" type="range" min="0" max="100" value="72">
            </label>
            <label class="slider-row">
              <span class="slider-label">
                <span>Ink Contours</span>
                <output id="ink-val" class="num-val">58%</output>
              </span>
              <input id="ink-slider" type="range" min="0" max="100" value="58">
            </label>
            <label class="slider-row">
              <span class="slider-label">
                <span>Halftone Print</span>
                <output id="halftone-val" class="num-val">32%</output>
              </span>
              <input id="halftone-slider" type="range" min="0" max="100" value="32">
            </label>
          </div>
        </section>
      </aside>

      <!-- Center Live Canvas Stage -->
      <main class="stage" aria-label="Live poster preview">
        <div id="stage-frame" class="stage-frame">
          <canvas id="cover-canvas" width="1280" height="720" aria-label="Interactive GTA cover art canvas"></canvas>
          <div id="drop-overlay" class="drop-overlay" hidden>
            <span>Drop photo onto panel</span>
          </div>
        </div>

        <div class="stage-bar">
          <div class="stage-hint">
            <span id="active-panel-badge" class="panel-chip">Panel 1 · Hero</span>
            <span class="hint-text">Click panel to select · Drag to pan · Scroll to zoom · Drop image on any panel</span>
          </div>
          <div class="stage-tools">
            <button id="btn-flip" class="btn-icon-text" type="button" title="Flip selected panel horizontally (F)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 3v18M8 7l-5 5 5 5M16 7l5 5-5 5"/>
              </svg>
              <span>Flip</span>
            </button>
            <button id="btn-reset-crop" class="btn-icon-text" type="button" title="Reset crop of selected panel (R)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              <span>Reset</span>
            </button>
            <span id="status-line" class="status-line" role="status" aria-live="polite">Ready offline</span>
          </div>
        </div>
      </main>

      <!-- Right Rail: Panel Framing, Cover Lettering & 1-Click PNG Export -->
      <aside class="rail rail-right" aria-label="Panel crop, lettering and export">
        <section class="panel-section">
          <div class="section-head">
            <h2>Selected Panel</h2>
            <label class="btn-inline-upload" for="upload-panel">
              Replace photo
              <input id="upload-panel" type="file" accept="image/*" hidden>
            </label>
          </div>

          <div class="control-grid-2">
            <label class="slider-row">
              <span class="slider-label">
                <span>Zoom</span>
                <output id="zoom-val" class="num-val">1.05×</output>
              </span>
              <input id="zoom-slider" type="range" min="100" max="280" value="105">
            </label>
            <label class="slider-row">
              <span class="slider-label">
                <span>Rotate</span>
                <output id="rotate-val" class="num-val">0°</output>
              </span>
              <input id="rotate-slider" type="range" min="-25" max="25" value="0">
            </label>
          </div>

          <div class="control-grid-2">
            <label class="field">
              <span>Swap Panel</span>
              <select id="swap-select" aria-label="Swap with another panel"></select>
            </label>
            <label class="field">
              <span>Panel Grade</span>
              <select id="panel-grade-select" aria-label="Per-panel color grade override"></select>
            </label>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-head">
            <h2>Cover Lettering</h2>
          </div>

          <div class="field-stack">
            <label class="field">
              <span>Main Title</span>
              <input id="caption-title" type="text" maxlength="28" value="VICE HORIZON" placeholder="VICE HORIZON">
            </label>

            <div class="control-grid-2">
              <label class="field">
                <span>Neon Script</span>
                <input id="caption-script" type="text" maxlength="24" value="Miami Sunset" placeholder="Miami Sunset">
              </label>
              <label class="field">
                <span>Corner Badge</span>
                <input id="badge-text" type="text" maxlength="14" value="VOL. 06" placeholder="VOL. 06">
              </label>
            </div>

            <label class="field">
              <span>Tagline</span>
              <input id="caption-tagline" type="text" maxlength="46" value="EVERY STREET HAS A PRICE" placeholder="EVERY STREET HAS A PRICE">
            </label>

            <div class="control-grid-2">
              <label class="field">
                <span>Title Style</span>
                <select id="title-style">
                  <option value="sunset-extrude">Sunset Gold 3D</option>
                  <option value="neon-chrome">Neon Chrome</option>
                  <option value="noir-gold">Noir Crimson</option>
                  <option value="clean-ink">Poster White</option>
                </select>
              </label>
              <label class="field">
                <span>Placement</span>
                <select id="title-position">
                  <option value="bottom-center">Bottom Center</option>
                  <option value="top-banner">Top Hero</option>
                  <option value="bottom-left">Lower Left</option>
                  <option value="center-emblem">Center Emblem</option>
                </select>
              </label>
            </div>

            <div class="toggle-grid">
              <label class="toggle-row">
                <input id="toggle-stars" type="checkbox" checked>
                <span>5-Star Heat</span>
              </label>
              <label class="toggle-row">
                <input id="toggle-footer" type="checkbox" checked>
                <span>Footer Strip</span>
              </label>
              <label class="toggle-row">
                <input id="toggle-starburst" type="checkbox" checked>
                <span>Edition Seal</span>
              </label>
            </div>
          </div>
        </section>

        <section class="panel-section export-section">
          <div class="section-head">
            <h2>Export PNG</h2>
            <span class="meta-pill">Lossless</span>
          </div>
          <div class="export-buttons">
            <button id="export-landscape" class="btn-export" type="button" data-export="landscape">
              <span class="exp-dim">1920 × 1080</span>
              <span class="exp-tag">16:9</span>
            </button>
            <button id="export-portrait" class="btn-export" type="button" data-export="portrait">
              <span class="exp-dim">1080 × 1350</span>
              <span class="exp-tag">4:5</span>
            </button>
            <button id="export-square" class="btn-export" type="button" data-export="square">
              <span class="exp-dim">1080 × 1080</span>
              <span class="exp-tag">1:1</span>
            </button>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
